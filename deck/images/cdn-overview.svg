<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>CDN overview: one origin, many edges</title>
  <defs>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="3.2" markerHeight="3.2" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1746c9"/>
    </marker>
    <marker id="ah-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9a5200"/>
    </marker>
    <marker id="ah-grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8a919c"/>
    </marker>

    <!-- Edge server: teal hexagon, cache icon, "cache" badge -->
    <g id="edge">
      <polygon points="0,-42 37,-21 37,21 0,42 -37,21 -37,-21" fill="#e3f1f2" stroke="#0b6f7c" stroke-width="4" stroke-linejoin="round"/>
      <ellipse cx="0" cy="-9" rx="14" ry="6" fill="none" stroke="#0b6f7c" stroke-width="3"/>
      <path d="M-14 -9 V10 A14 6 0 0 0 14 10 V-9" fill="none" stroke="#0b6f7c" stroke-width="3"/>
      <path d="M-14 0.5 A14 6 0 0 0 14 0.5" fill="none" stroke="#0b6f7c" stroke-width="3"/>
      <rect x="-31" y="30" width="62" height="26" rx="13" fill="#0b6f7c"/>
      <text x="0" y="49" text-anchor="middle" font-size="18" font-weight="600" fill="#ffffff">cache</text>
    </g>

    <!-- User: blue circle with person -->
    <g id="user">
      <circle r="42" fill="#ffffff" stroke="#1746c9" stroke-width="4"/>
      <circle cx="0" cy="-9" r="10" fill="none" stroke="#1746c9" stroke-width="4"/>
      <path d="M-20 22 A20 17 0 0 1 20 22" fill="none" stroke="#1746c9" stroke-width="4" stroke-linecap="round"/>
    </g>
  </defs>


  <!-- Regions -->
  <g>
    <rect x="20" y="70" width="380" height="600" rx="22" fill="#f4f6fa" stroke="#d6dbe4" stroke-width="2"/>
    <rect x="410" y="70" width="360" height="600" rx="22" fill="#f4f6fa" stroke="#d6dbe4" stroke-width="2"/>
    <rect x="780" y="70" width="400" height="600" rx="22" fill="#f4f6fa" stroke="#d6dbe4" stroke-width="2"/>
    <g font-size="24" font-weight="700" letter-spacing="3" fill="#6b7280" text-anchor="middle">
      <text x="210" y="110">ASIA</text>
      <text x="590" y="110">EUROPE</text>
      <text x="980" y="110">UNITED STATES</text>
    </g>
  </g>

  <!-- Without a CDN: faded grey, long way round -->
  <path d="M115 404 C 140 650, 900 690, 990 296" fill="none" stroke="#8a919c" stroke-width="4" stroke-linecap="round" marker-end="url(#ah-grey)" opacity="0.8"/>
  <rect x="300" y="602" width="480" height="46" rx="10" fill="#ffffff" stroke="#d6dbe4" stroke-width="2"/>
  <text x="540" y="634" text-anchor="middle" font-size="26" fill="#6b7280" font-style="italic">without a CDN: ~200 ms per round trip</text>

  <!-- Cache MISS: long, thin, dashed edge-to-origin calls -->
  <path d="M320 316 C 430 200, 700 170, 886 196" fill="none" stroke="#9a5200" stroke-width="3" stroke-dasharray="12 9" stroke-linecap="round" marker-end="url(#ah-amber)"/>
  <path d="M704 336 L 886 246" fill="none" stroke="#9a5200" stroke-width="3" stroke-dasharray="12 9" stroke-linecap="round" marker-end="url(#ah-amber)"/>
  <text x="540" y="172" text-anchor="middle" font-size="24" font-weight="600" fill="#9a5200">only on a cache MISS</text>
  <text x="786" y="338" font-size="24" font-weight="600" fill="#9a5200">only on a</text>
  <text x="786" y="366" font-size="24" font-weight="600" fill="#9a5200">cache MISS</text>

  <!-- Hanoi -->
  <use href="#user" x="115" y="360"/>
  <text x="115" y="300" text-anchor="middle" font-size="24" font-weight="600" fill="#1746c9">User in Hanoi</text>
  <line x1="165" y1="360" x2="268" y2="360" stroke="#1746c9" stroke-width="7" stroke-linecap="round" marker-end="url(#ah-blue)"/>
  <text x="216" y="338" text-anchor="middle" font-size="26" font-weight="700" fill="#1746c9">~20 ms</text>
  <use href="#edge" x="320" y="360"/>
  <text x="320" y="440" text-anchor="middle" font-size="24" font-weight="600" fill="#0b6f7c">Edge · Hanoi</text>

  <!-- Singapore -->
  <use href="#edge" x="90" y="530"/>
  <text x="90" y="630" text-anchor="middle" font-size="24" font-weight="600" fill="#0b6f7c">Edge</text>
  <text x="90" y="656" text-anchor="middle" font-size="24" font-weight="600" fill="#0b6f7c">Singapore</text>

  <!-- Paris -->
  <use href="#user" x="470" y="360"/>
  <text x="470" y="300" text-anchor="middle" font-size="24" font-weight="600" fill="#1746c9">User in Paris</text>
  <line x1="518" y1="360" x2="620" y2="360" stroke="#1746c9" stroke-width="7" stroke-linecap="round" marker-end="url(#ah-blue)"/>
  <text x="570" y="338" text-anchor="middle" font-size="26" font-weight="700" fill="#1746c9">~20 ms</text>
  <use href="#edge" x="670" y="360"/>
  <text x="670" y="440" text-anchor="middle" font-size="24" font-weight="600" fill="#0b6f7c">Edge · Paris</text>

  <!-- US edge -->
  <use href="#edge" x="1090" y="500"/>
  <text x="1090" y="580" text-anchor="middle" font-size="24" font-weight="600" fill="#0b6f7c">Edge · US</text>

  <!-- Origin: purple, one place -->
  <rect x="890" y="150" width="200" height="146" rx="16" fill="#efe8f8" stroke="#6d35b5" stroke-width="4"/>
  <rect x="954" y="164" width="72" height="26" rx="6" fill="none" stroke="#6d35b5" stroke-width="3"/>
  <rect x="954" y="196" width="72" height="26" rx="6" fill="none" stroke="#6d35b5" stroke-width="3"/>
  <circle cx="967" cy="177" r="3.5" fill="#6d35b5"/>
  <circle cx="967" cy="209" r="3.5" fill="#6d35b5"/>
  <text x="990" y="254" text-anchor="middle" font-size="28" font-weight="700" fill="#6d35b5">Origin</text>
  <text x="990" y="282" text-anchor="middle" font-size="22" fill="#6d35b5">(one place)</text>

  <!-- Inset: cache next to the origin -->
  <rect x="20" y="700" width="1160" height="170" rx="22" fill="none" stroke="#d6dbe4" stroke-width="2" stroke-dasharray="10 8"/>
  <g>
    <circle cx="90" cy="790" r="26" fill="#ffffff" stroke="#1746c9" stroke-width="3"/>
    <circle cx="90" cy="783" r="6" fill="none" stroke="#1746c9" stroke-width="3"/>
    <path d="M77 803 A13 11 0 0 1 103 803" fill="none" stroke="#1746c9" stroke-width="3" stroke-linecap="round"/>
    <line x1="126" y1="790" x2="470" y2="790" stroke="#8a919c" stroke-width="4" stroke-linecap="round" marker-end="url(#ah-grey)"/>
    <text x="298" y="772" text-anchor="middle" font-size="22" fill="#6b7280">same long distance</text>
    <rect x="490" y="758" width="84" height="64" rx="12" fill="#e3f1f2" stroke="#0b6f7c" stroke-width="3"/>
    <text x="532" y="796" text-anchor="middle" font-size="20" font-weight="600" fill="#0b6f7c">cache</text>
    <rect x="590" y="758" width="100" height="64" rx="12" fill="#efe8f8" stroke="#6d35b5" stroke-width="3"/>
    <text x="640" y="796" text-anchor="middle" font-size="20" font-weight="600" fill="#6d35b5">origin</text>
  </g>
  <text x="730" y="776" font-size="26" font-weight="700" fill="#1f2937">Cache next to the origin</text>
  <text x="730" y="808" font-size="24" fill="#4b5563">(Varnish, Nginx)</text>
  <text x="730" y="840" font-size="24" fill="#4b5563">Less load, same distance</text>
</svg>
