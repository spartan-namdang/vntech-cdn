<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>CloudFront hook points: viewer request, origin request, origin response and viewer response around the edge cache</title>
  <defs>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1746c9"/>
    </marker>
    <marker id="ah-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#12733b"/>
    </marker>
    <marker id="ah-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9a5200"/>
    </marker>
  </defs>

  <rect width="1200" height="900" fill="#ffffff"/>

  <!-- Viewer -->
  <rect x="20" y="190" width="150" height="520" rx="18" fill="#e8eefc" stroke="#1746c9" stroke-width="4"/>
  <rect x="45" y="395" width="100" height="72" rx="9" fill="#ffffff" stroke="#1746c9" stroke-width="4"/>
  <line x1="45" y1="415" x2="145" y2="415" stroke="#1746c9" stroke-width="4"/>
  <circle cx="58" cy="405" r="3" fill="#1746c9"/>
  <circle cx="69" cy="405" r="3" fill="#1746c9"/>
  <text x="95" y="512" font-size="30" font-weight="700" text-anchor="middle" fill="#1746c9">Viewer</text>

  <!-- Edge cache -->
  <rect x="440" y="130" width="340" height="610" rx="20" fill="#e3f1f2" stroke="#0b6f7c" stroke-width="4"/>
  <text x="462" y="177" font-size="30" font-weight="700" fill="#0b6f7c">Edge cache</text>
  <!-- cache badge -->
  <rect x="640" y="148" width="122" height="38" rx="19" fill="#0b6f7c"/>
  <g fill="none" stroke="#ffffff" stroke-width="2.5">
    <ellipse cx="662" cy="159" rx="10" ry="4"/>
    <path d="M652 159 v14 a10 4 0 0 0 20 0 v-14"/>
    <path d="M652 166 a10 4 0 0 0 20 0"/>
  </g>
  <text x="722" y="174" font-size="20" font-weight="700" letter-spacing="1" text-anchor="middle" fill="#ffffff">CACHE</text>

  <!-- cache lookup -->
  <rect x="480" y="215" width="240" height="50" rx="25" fill="#ffffff" stroke="#0b6f7c" stroke-width="3.5"/>
  <text x="600" y="248" font-size="24" font-weight="700" text-anchor="middle" fill="#0b6f7c">Cache lookup</text>

  <!-- HIT card -->
  <rect x="490" y="300" width="210" height="130" rx="14" fill="#e6f4ec" stroke="#12733b" stroke-width="3.5"/>
  <g text-anchor="middle" fill="#12733b">
    <text x="595" y="332" font-size="28" font-weight="700">HIT</text>
    <text x="595" y="362" font-size="21">return to viewer,</text>
    <text x="595" y="388" font-size="21">hooks 2 and 3</text>
    <text x="595" y="414" font-size="21">are skipped</text>
  </g>

  <!-- MISS card -->
  <rect x="490" y="455" width="260" height="140" rx="14" fill="#fbeedd" stroke="#9a5200" stroke-width="3.5"/>
  <g text-anchor="middle" fill="#9a5200">
    <text x="620" y="496" font-size="28" font-weight="700">MISS</text>
    <text x="620" y="531" font-size="21">go on to the origin</text>
    <text x="620" y="562" font-size="21">hooks 2 and 3 run</text>
  </g>

  <!-- inner fork: lookup -> HIT / MISS -->
  <g fill="none" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <line x1="585" y1="267" x2="585" y2="297" stroke="#12733b" marker-end="url(#ah-green)"/>
    <path d="M722 240 H735 V452" stroke="#9a5200" marker-end="url(#ah-amber)"/>
    <!-- HIT and MISS both rejoin the viewer response lane -->
    <path d="M490 365 H465 V655" stroke="#12733b"/>
    <path d="M620 597 V655 H465" stroke="#9a5200"/>
  </g>

  <!-- Origin -->
  <rect x="1050" y="405" width="130" height="225" rx="18" fill="#efe8f8" stroke="#6d35b5" stroke-width="4"/>
  <g fill="#ffffff" stroke="#6d35b5" stroke-width="4">
    <path d="M1081 450 v48 a34 11 0 0 0 68 0 v-48"/>
    <ellipse cx="1115" cy="450" rx="34" ry="11"/>
  </g>
  <path d="M1081 474 a34 11 0 0 0 68 0" fill="none" stroke="#6d35b5" stroke-width="4"/>
  <text x="1115" y="572" font-size="30" font-weight="700" text-anchor="middle" fill="#6d35b5">Origin</text>

  <!-- Hook arrows -->
  <g fill="none" stroke-linecap="round">
    <!-- 1 viewer request: every request, bold -->
    <line x1="176" y1="240" x2="476" y2="240" stroke="#1746c9" stroke-width="7" marker-end="url(#ah-blue)"/>
    <!-- 4 viewer response: every request, bold -->
    <line x1="465" y1="655" x2="176" y2="655" stroke="#1746c9" stroke-width="7" marker-end="url(#ah-blue)"/>
    <!-- 2 origin request: MISS only, light -->
    <line x1="750" y1="485" x2="1046" y2="485" stroke="#9a5200" stroke-width="3" marker-end="url(#ah-amber)"/>
    <!-- 3 origin response: MISS only, light -->
    <line x1="1050" y1="550" x2="754" y2="550" stroke="#9a5200" stroke-width="3" marker-end="url(#ah-amber)"/>
  </g>
  <circle cx="465" cy="655" r="8" fill="#1746c9"/>

  <!-- Hook badges -->
  <g text-anchor="middle" font-weight="700">
    <circle cx="305" cy="240" r="27" fill="#ffffff" stroke="#1746c9" stroke-width="7"/>
    <text x="305" y="251" font-size="30" fill="#1746c9">1</text>
    <circle cx="305" cy="655" r="27" fill="#ffffff" stroke="#1746c9" stroke-width="7"/>
    <text x="305" y="666" font-size="30" fill="#1746c9">4</text>
    <circle cx="915" cy="485" r="22" fill="#ffffff" stroke="#9a5200" stroke-width="3"/>
    <text x="915" y="494" font-size="25" fill="#9a5200">2</text>
    <circle cx="915" cy="550" r="22" fill="#ffffff" stroke="#9a5200" stroke-width="3"/>
    <text x="915" y="559" font-size="25" fill="#9a5200">3</text>
  </g>

  <!-- Hook labels -->
  <g text-anchor="middle">
    <text x="305" y="150" font-size="28" font-weight="700" fill="#1746c9">Viewer request</text>
    <text x="305" y="180" font-size="21" fill="#374151">before the cache lookup,</text>
    <text x="305" y="206" font-size="21" font-weight="700" fill="#374151">runs on EVERY request</text>

    <text x="305" y="722" font-size="28" font-weight="700" fill="#1746c9">Viewer response</text>
    <text x="305" y="752" font-size="21" fill="#374151">right before the viewer,</text>
    <text x="305" y="778" font-size="21" font-weight="700" fill="#374151">runs on EVERY request</text>

    <text x="915" y="418" font-size="26" font-weight="600" fill="#9a5200">Origin request</text>
    <text x="915" y="446" font-size="21" fill="#374151">only on a MISS</text>

    <text x="915" y="612" font-size="26" font-weight="600" fill="#9a5200">Origin response</text>
    <text x="915" y="640" font-size="21" fill="#374151">result is cached</text>
  </g>

  <!-- Legend -->
  <g font-size="22" fill="#374151">
    <line x1="40" y1="845" x2="100" y2="845" stroke="#1746c9" stroke-width="7" stroke-linecap="round"/>
    <text x="116" y="853">Bold: hooks 1 and 4, every request</text>
    <line x1="640" y1="845" x2="700" y2="845" stroke="#9a5200" stroke-width="3" stroke-linecap="round"/>
    <text x="716" y="853">Light: hooks 2 and 3, MISS only</text>
  </g>
</svg>
