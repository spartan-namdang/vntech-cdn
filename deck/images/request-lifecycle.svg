<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>Request lifecycle: DNS, connect, cache lookup, then HIT at the edge or MISS to the origin</title>
  <defs>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1746c9"/>
    </marker>
    <marker id="ah-grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6b7280"/>
    </marker>
    <marker id="ah-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#12733b"/>
    </marker>
    <marker id="ah-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9a5200"/>
    </marker>
    <marker id="ah-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6d35b5"/>
    </marker>
  </defs>

  <rect width="1200" height="900" fill="#ffffff"/>

  <!-- Lifelines: Browser x=110, DNS x=400, Edge x=680, Origin x=1090 -->
  <g stroke-width="3" stroke-linecap="round">
    <line x1="110" y1="84" x2="110" y2="880" stroke="#1746c9" opacity="0.35"/>
    <line x1="400" y1="84" x2="400" y2="880" stroke="#8a919c" opacity="0.5"/>
    <line x1="680" y1="84" x2="680" y2="880" stroke="#0b6f7c" opacity="0.4"/>
    <line x1="1090" y1="84" x2="1090" y2="408" stroke="#6d35b5" opacity="0.4"/>
    <line x1="1090" y1="520" x2="1090" y2="880" stroke="#6d35b5" opacity="0.4"/>
    <!-- origin greyed out inside the HIT frame -->
    <line x1="1090" y1="408" x2="1090" y2="520" stroke="#b4bac4" stroke-dasharray="3 9"/>
  </g>

  <!-- Actor headers -->
  <g font-size="26" font-weight="700" text-anchor="middle">
    <rect x="30" y="16" width="160" height="56" rx="12" fill="#ffffff" stroke="#1746c9" stroke-width="3.5"/>
    <text x="110" y="52" fill="#1746c9">Browser</text>
    <rect x="320" y="16" width="160" height="56" rx="12" fill="#f4f6fa" stroke="#6b7280" stroke-width="3.5"/>
    <text x="400" y="52" fill="#4b5563">DNS</text>
    <rect x="600" y="16" width="160" height="56" rx="12" fill="#e3f1f2" stroke="#0b6f7c" stroke-width="3.5"/>
    <text x="680" y="52" fill="#0b6f7c">Edge</text>
    <rect x="1010" y="16" width="160" height="56" rx="12" fill="#efe8f8" stroke="#6d35b5" stroke-width="3.5"/>
    <text x="1090" y="52" fill="#6d35b5">Origin</text>
  </g>

  <!-- Step badges -->
  <g font-size="22" font-weight="700" text-anchor="middle" fill="#ffffff">
    <circle cx="58" cy="150" r="17" fill="#1746c9"/><text x="58" y="158">1</text>
    <circle cx="58" cy="262" r="17" fill="#1746c9"/><text x="58" y="270">2</text>
    <circle cx="58" cy="335" r="17" fill="#1746c9"/><text x="58" y="343">3</text>
  </g>

  <!-- 1. DNS -->
  <g font-size="21" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="7" stroke-linejoin="round">
    <line x1="116" y1="158" x2="394" y2="158" stroke="#1746c9" stroke-width="3" marker-end="url(#ah-blue)"/>
    <text x="255" y="148" fill="#1746c9" stroke="#ffffff" stroke-width="7" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="19">static.example.com ?</text>
    <line x1="394" y1="212" x2="116" y2="212" stroke="#6b7280" stroke-width="3" stroke-dasharray="9 6" marker-end="url(#ah-grey)"/>
    <text x="255" y="202" fill="#4b5563" stroke="#ffffff" stroke-width="7">CNAME to CDN → edge IP</text>
  </g>

  <!-- 2. TCP + TLS (short: the edge is near) -->
  <g font-size="21" text-anchor="middle">
    <line x1="116" y1="270" x2="674" y2="270" stroke="#1746c9" stroke-width="3" marker-start="url(#ah-blue)" marker-end="url(#ah-blue)"/>
    <text x="540" y="260" fill="#1746c9" font-weight="600" paint-order="stroke" stroke="#ffffff" stroke-width="7" stroke-linejoin="round">TCP + TLS handshake</text>
    <text x="540" y="297" fill="#6b7280" font-size="19" font-style="italic" paint-order="stroke" stroke="#ffffff" stroke-width="7" stroke-linejoin="round">short: the edge is near</text>
  </g>

  <!-- 3. GET + cache key -->
  <g font-size="21" text-anchor="middle">
    <line x1="116" y1="343" x2="674" y2="343" stroke="#1746c9" stroke-width="3" marker-end="url(#ah-blue)"/>
    <text x="395" y="333" fill="#1746c9" font-weight="600" paint-order="stroke" stroke="#ffffff" stroke-width="7" stroke-linejoin="round" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="20">GET /app.js</text>
    <rect x="704" y="318" width="372" height="54" rx="10" fill="#e3f1f2" stroke="#0b6f7c" stroke-width="3"/>
    <text x="890" y="352" fill="#0b6f7c" font-weight="600" font-size="21">cache key = host + path + query</text>
  </g>

  <!-- ===== HIT frame: short ===== -->
  <rect x="22" y="408" width="1156" height="112" rx="16" fill="none" stroke="#12733b" stroke-width="4"/>
  <rect x="22" y="408" width="300" height="40" rx="12" fill="#12733b"/>
  <rect x="22" y="430" width="300" height="18" fill="#12733b"/>
  <text x="40" y="436" font-size="23" font-weight="700" fill="#ffffff">HIT · stops at the edge</text>
  <circle cx="58" cy="486" r="17" fill="#12733b"/>
  <text x="58" y="494" font-size="22" font-weight="700" text-anchor="middle" fill="#ffffff">4</text>
  <line x1="674" y1="494" x2="116" y2="494" stroke="#12733b" stroke-width="3.5" marker-end="url(#ah-green)"/>
  <text x="395" y="482" font-weight="600" text-anchor="middle" fill="#12733b" paint-order="stroke" stroke="#ffffff" stroke-width="7" stroke-linejoin="round" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="19">200 · Age: 120 · X-Cache: Hit</text>
  <rect x="868" y="468" width="206" height="40" rx="20" fill="#f4f6fa" stroke="#b4bac4" stroke-width="2.5" stroke-dasharray="6 5"/>
  <text x="971" y="495" font-size="20" font-style="italic" text-anchor="middle" fill="#6b7280">origin sees nothing</text>

  <!-- ===== MISS frame: long ===== -->
  <rect x="22" y="546" width="1156" height="330" rx="16" fill="none" stroke="#9a5200" stroke-width="4"/>
  <rect x="22" y="546" width="410" height="40" rx="12" fill="#9a5200"/>
  <rect x="22" y="568" width="410" height="18" fill="#9a5200"/>
  <text x="40" y="574" font-size="23" font-weight="700" fill="#ffffff">MISS · fetched once, then stored</text>

  <g font-size="21" text-anchor="middle">
    <!-- Edge -> Origin -->
    <line x1="686" y1="650" x2="1084" y2="650" stroke="#9a5200" stroke-width="3.5" marker-end="url(#ah-amber)"/>
    <text x="885" y="638" fill="#9a5200" font-weight="600" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="20" paint-order="stroke" stroke="#ffffff" stroke-width="7" stroke-linejoin="round">GET /app.js</text>
    <!-- Origin -> Edge -->
    <line x1="1084" y1="724" x2="686" y2="724" stroke="#6d35b5" stroke-width="3.5" stroke-dasharray="9 6" marker-end="url(#ah-purple)"/>
    <text x="885" y="700" fill="#6d35b5" font-weight="600" font-size="20" paint-order="stroke" stroke="#ffffff" stroke-width="7" stroke-linejoin="round">200 + Cache-Control:</text>
    <text x="885" y="754" fill="#6d35b5" font-weight="600" font-size="20" font-family="ui-monospace, 'SF Mono', Menlo, monospace" paint-order="stroke" stroke="#ffffff" stroke-width="7" stroke-linejoin="round">max-age=…</text>
    <!-- store -->
    <rect x="704" y="776" width="150" height="42" rx="10" fill="#e3f1f2" stroke="#0b6f7c" stroke-width="3"/>
    <text x="779" y="805" fill="#0b6f7c" font-weight="700" font-size="22">store</text>
  </g>

  <!-- Edge -> Browser -->
  <circle cx="58" cy="840" r="17" fill="#9a5200"/>
  <text x="58" y="848" font-size="22" font-weight="700" text-anchor="middle" fill="#ffffff">4</text>
  <line x1="674" y1="848" x2="116" y2="848" stroke="#9a5200" stroke-width="3.5" marker-end="url(#ah-amber)"/>
  <text x="395" y="836" font-size="19" font-weight="600" text-anchor="middle" fill="#9a5200" paint-order="stroke" stroke="#ffffff" stroke-width="7" stroke-linejoin="round" font-family="ui-monospace, 'SF Mono', Menlo, monospace">200 · X-Cache: Miss</text>
</svg>
